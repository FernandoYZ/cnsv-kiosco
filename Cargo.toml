[package]
name = "cnsv-kiosco"
version = "1.0.1"
edition = "2024"

[dependencies]
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
hmac = "0.12"
maud = { version = "0.27.0", features = ["axum"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rusqlite = { version = "0.9.0", features = ["bundled", "chrono"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["compression-gzip", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[dev-dependencies]
rstest = "0.28.0"
tower = { version = "0.5.3", features = ["util"] }
